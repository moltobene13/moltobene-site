<style>
:root{
  --paper:#F0EDE5;--paper-alt:#E8E4DB;--ink:#0D0C0B;--ink2:#1A1714;
  --muted:#6B6560;
  --mustard:#D4AA20;
  --f-display:'Fraunces',Georgia,serif;
  --f-mono:'Courier Prime','Courier New',monospace;
  --f-body:'Barlow',sans-serif;
}
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box;}
html{-webkit-text-size-adjust:100%;}
.manifesto-body{
  background:var(--ink);
  margin:0;
  min-height:100vh;
  min-height:100svh;
  display:flex;
  align-items:center;
  justify-content:center;
  font-family:var(--f-body);
  -webkit-font-smoothing:antialiased;
  position:relative;
  overflow:hidden;
}
.manifesto-body::before{
  content:'';
  position:absolute;
  top:-20%;left:50%;transform:translateX(-50%);
  width:min(900px,90vw);height:min(900px,90vw);
  border-radius:50%;
  background:radial-gradient(circle,rgba(212,170,32,.10) 0%,transparent 65%);
  pointer-events:none;
}
.manifesto-s{
  width:100%;
  padding:6vw;
  position:relative;
  z-index:1;
}
.manifesto-inner{
  max-width:1100px;
  margin:0 auto;
  text-align:center;
}
.manifesto-eyebrow{
  font-family:var(--f-mono);
  font-size:11px;
  letter-spacing:.32em;
  text-transform:uppercase;
  color:var(--mustard);
  margin-bottom:48px;
}
.manifesto-title{
  font-family:var(--f-display);
  font-weight:800;
  font-size:clamp(38px,6.8vw,110px);
  line-height:1.04;
  letter-spacing:-.025em;
  color:var(--paper);
  margin:0;
}
.manifesto-title em{
  font-style:italic;
  font-weight:700;
  color:var(--mustard);
}
.manifesto-back{
  display:inline-block;
  margin-top:64px;
  font-family:var(--f-mono);
  font-size:11px;
  letter-spacing:.22em;
  text-transform:uppercase;
  color:var(--paper);
  text-decoration:none;
  opacity:.6;
  transition:opacity .25s;
}
.manifesto-back:hover{opacity:1;}
@media(max-width:600px){
  .manifesto-eyebrow{margin-bottom:32px;}
  .manifesto-back{margin-top:48px;}
}
</style>
</head>
<body class="manifesto-body">
  <section class="manifesto-s">
    <div class="manifesto-inner">
      <p class="manifesto-eyebrow">Manifeste · Molto Bene</p>
      <h1 class="manifesto-title">
        Le futur de l'image de mode<br/>
        <em>n'est pas de produire plus.</em><br/>
        C'est de <em>décider mieux.</em>
      </h1>
      <a href="/" class="manifesto-back">← Retour au studio</a>
    </div>
  </section>
</body>
</html>
