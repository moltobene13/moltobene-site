<link rel="stylesheet" href="/assets/mb/mb.css?v=15">
<style>
.mf{position:relative;height:260vh}
.mf-pin{position:sticky;top:0;height:100svh;display:flex;flex-direction:column;justify-content:center;padding:110px var(--gut) var(--gut);overflow:hidden}
.mf-bg{position:absolute;inset:0;opacity:.0;transition:opacity .2s}
.mf-bg img{width:100%;height:100%;object-fit:cover;filter:grayscale(.3)}
.mf-bg::after{content:'';position:absolute;inset:0;background:linear-gradient(rgba(10,10,9,.55),rgba(10,10,9,.85))}
.mf h1{position:relative;z-index:2;font-size:clamp(44px,8.6vw,170px);max-width:14ch}
.mf h1 .w{color:rgba(238,234,226,.12);transition:color .25s}
.mf h1 .w.lit{color:var(--paper)}
.mf h1 .w.s{font-family:var(--f-serif);font-style:italic;font-weight:400;text-transform:none;letter-spacing:-.01em;font-variation-settings:normal}
.mf h1 .w.s.lit{color:var(--mustard)}
.mf .eyebrow{position:relative;z-index:2;margin-bottom:34px}
.mf-foot{position:relative;z-index:2;display:flex;justify-content:space-between;gap:20px;margin-top:50px}
</style>
</head>
<body data-page="manifeste">
<main id="main">
<section class="mf" id="mf">
  <div class="mf-pin">
    <div class="mf-bg" id="mfbg"><img src="/assets/px-sienna.jpg" alt=""><span class="ia-mark" aria-label="Visuel généré par IA">IA</span></div>
    <p class="eyebrow">Manifeste · Molto Bene</p>
    <h1 class="wide" id="mft" aria-label="Le futur de l'image de mode n'est pas de produire plus. C'est de décider mieux.">Le futur de l'image de mode <em>n'est pas de produire plus.</em> C'est de <em>décider mieux.</em></h1>
    <div class="mf-foot mono"><a href="/" class="back">← Retour au studio</a><span class="muted">Faites défiler ↓</span></div>
  </div>
</section>
</main>
<script src="https://unpkg.com/lenis@1.1.13/dist/lenis.min.js"></script>
<script src="/assets/mb/site-data.js?v=14"></script>
<script src="/assets/mb/mb.js?v=7"></script>
<script>
(function(){
  const h=document.getElementById('mft'), bg=document.getElementById('mfbg'), sec=document.getElementById('mf');
  const parts=[...h.childNodes].flatMap(n=>{const s=n.nodeType===3; return n.textContent.trim().split(/\s+/).filter(Boolean).map(w=>`<span class="w${s?'':' s'}" aria-hidden="true">${w}</span>`);});
  h.innerHTML=parts.join(' ');
  const ws=h.querySelectorAll('.w');
  const upd=()=>{const p=Math.min(1,Math.max(0,-sec.getBoundingClientRect().top/(sec.offsetHeight-innerHeight)));
    const n=Math.ceil(p*1.25*ws.length); ws.forEach((w,i)=>w.classList.toggle('lit',i<n)); bg.style.opacity=Math.max(0,(p-.75)*4)*.9;};
  addEventListener('scroll',upd,{passive:true}); upd();
})();
renderFooter();
</script>
</body>
</html>
