<!DOCTYPE html>
<html lang="fr"><head>
<meta charset="UTF-8"/>
<title>Page introuvable · Molto Bene</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<meta name="robots" content="noindex"/>
<meta name="theme-color" content="#0D0C0B"/>
<link rel="icon" type="image/x-icon" href="/assets/favicon.ico">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..900;1,9..144,300..900&family=Courier+Prime:wght@400;700&family=Barlow:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--paper:#F0EDE5;--ink:#0D0C0B;--ink2:#1A1714;--muted:#6B6560;--mustard:#D4AA20;
  --f-display:'Fraunces',Georgia,serif;--f-mono:'Courier Prime',ui-monospace,monospace;--f-body:'Barlow',system-ui,sans-serif;}
*{box-sizing:border-box;}
body{margin:0;min-height:100vh;background:var(--paper);color:var(--ink);
  font-family:var(--f-body);display:flex;align-items:center;justify-content:center;padding:32px;}
main{max-width:520px;text-align:center;}
.eyebrow{font-family:var(--f-mono);font-size:11px;letter-spacing:.32em;text-transform:uppercase;color:var(--mustard);margin:0 0 20px;}
h1{font-family:var(--f-display);font-weight:800;font-size:clamp(32px,6vw,58px);line-height:.98;letter-spacing:-.025em;margin:0 0 18px;}
h1 em{font-style:italic;color:var(--mustard);}
p{font-size:15px;line-height:1.66;color:var(--ink2);margin:0 auto 30px;max-width:400px;}
.cta{display:inline-flex;align-items:center;height:44px;padding:0 26px;border-radius:999px;
  font-family:var(--f-mono);font-size:11px;letter-spacing:.18em;text-transform:uppercase;
  text-decoration:none;background:var(--mustard);color:var(--ink);border:1px solid var(--mustard);
  transition:background .2s,color .2s;}
.cta:hover{background:transparent;color:var(--ink);}
.links{margin-top:26px;font-family:var(--f-mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);}
.links a{color:var(--muted);text-decoration:none;border-bottom:1px solid rgba(13,12,11,.2);padding-bottom:2px;}
.links a:hover{color:var(--ink);}
</style>
</head>
<body>
<main>
  <p class="eyebrow">Erreur 404</p>
  <h1>Cette page <em>n'existe pas.</em></h1>
  <p>Le lien est peut-être ancien, ou l'adresse comporte une coquille. Le studio, lui, est toujours là.</p>
  <a class="cta" href="/">Retour à l'accueil →</a>
  <p class="links"><a href="/#cases">Nos réalisations</a> · <a href="/#modeles">Nos modèles</a></p>
</main>
</body></html>
